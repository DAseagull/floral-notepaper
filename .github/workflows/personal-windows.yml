name: Personal Windows Build
on:
  push:
    branches: [feat/personal-pins-transparency]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx oxfmt --check
      - name: Check Rust formatting and preserve diagnostics
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --output=rustfmt.patch -- src-tauri
          git diff --exit-code -- src-tauri
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p floral-notepaper --lib
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Prepare verified NSIS toolchain
        shell: pwsh
        run: scripts/prepare-nsis-toolchain.ps1
      - name: Build installer and portable application
        run: npm run tauri build -- --bundles nsis
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path personal-artifacts -Force | Out-Null
          Copy-Item src-tauri/target/release/floral-notepaper.exe personal-artifacts/floral-seagull-portable.exe
          Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Copy-Item -Destination personal-artifacts
          Copy-Item Docs/PERSONAL_BUILD.md personal-artifacts/README.md
          Get-ChildItem personal-artifacts -Filter *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0} *{1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } | Set-Content personal-artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-build-diagnostics
          path: |
            rustfmt.patch
            src-tauri/Cargo.lock
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: floral-seagull-windows-x64
          path: personal-artifacts/
          retention-days: 30
